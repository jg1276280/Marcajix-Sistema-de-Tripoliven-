{% if employee.status == "active" %}<span class="badge badge-success"><i class="dot"></i>Activo</span>{% elif employee.status == "vacation" %}<span class="badge badge-info"><i class="dot"></i>Vacaciones</span>{% elif employee.status == "suspended" %}<span class="badge badge-danger"><i class="dot"></i>Suspendido</span>{% else %}<span class="badge"><i class="dot"></i>{{ employee.get_status_display }}</span>{% endif %}
