<div class="field {% if field.errors %}has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="muted">(opcional)</span>{% endif %}</label>
  {{ field }}
  {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
</div>
