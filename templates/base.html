{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Marcajix / Base{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;650;700;800&family=Sometype+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/ui-bundle.css' %}?v=1">
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">{% block content %}{% endblock %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('input[type="password"]').forEach((input) => {
    if (input.closest('.password-control')) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'password-control';
    input.parentNode.insertBefore(wrapper, input);
    wrapper.appendChild(input);

    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'password-toggle';
    toggle.setAttribute('aria-label', 'Mostrar contraseña');
    toggle.setAttribute('title', 'Mostrar contraseña');
    toggle.innerHTML = '<span class="eye-icon" aria-hidden="true"></span>';
    toggle.addEventListener('click', () => {
      const visible = input.type === 'text';
      input.type = visible ? 'password' : 'text';
      toggle.dataset.visible = String(!visible);
      toggle.setAttribute('aria-label', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
      toggle.setAttribute('title', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
    });
    wrapper.appendChild(toggle);
  });
});
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
