<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garita / Marcajix</title>
  <style>
    /* Pantalla exterior de la garita: sin recursos externos (la PC puede no tener internet). */
    :root {
      --brand: #c8102e;
      --brand-dark: #8f0b20;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: #e5e5ea;
      --surface: #f5f5f7;
      --entry: #1f8a4c;
      --exit: #c8102e;
      --warning: #b25e00;
      --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #fff; color: var(--ink); font-family: var(--font); overflow: hidden; cursor: none; }
    .kiosk { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    .kiosk-header { display: flex; align-items: center; justify-content: space-between; padding: 2.5vh 4vw; border-bottom: 6px solid var(--brand); }
    .brand { font-size: clamp(20px, 2.4vw, 40px); font-weight: 800; letter-spacing: -0.02em; }
    .brand span { color: var(--brand); }
    .header-date { font-size: clamp(16px, 1.6vw, 28px); color: var(--muted); }
    .stage { display: grid; place-items: center; padding: 3vh 4vw; }
    .idle { text-align: center; }
    .idle-clock { font-size: clamp(80px, 14vw, 260px); font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
    .idle-hint { margin-top: 3vh; font-size: clamp(22px, 2.6vw, 48px); color: var(--muted); }
    .card { display: none; width: min(1400px, 100%); grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); gap: 4vw; align-items: center; }
    .card.is-visible { display: grid; animation: enter 0.25s ease-out; }
    @keyframes enter { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: none; } }
    .photo { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 28px; background: var(--surface); border: 1px solid var(--line); }
    .photo.placeholder { display: grid; place-items: center; font-size: clamp(80px, 12vw, 220px); font-weight: 800; color: var(--muted); }
    .badge { display: inline-block; padding: 1.2vh 2.4vw; border-radius: 999px; color: #fff; font-size: clamp(28px, 4vw, 72px); font-weight: 800; letter-spacing: 0.04em; }
    .badge.entry { background: var(--entry); }
    .badge.exit { background: var(--exit); }
    .badge.denied { background: var(--brand-dark); }
    .badge.unknown_card { background: var(--warning); }
    .name { margin: 3vh 0 1vh; font-size: clamp(36px, 5vw, 96px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
    .meta { font-size: clamp(22px, 2.4vw, 44px); color: var(--muted); }
    .time { margin-top: 3vh; font-size: clamp(40px, 5.5vw, 104px); font-weight: 700; font-variant-numeric: tabular-nums; }
    .message { margin-top: 2vh; font-size: clamp(22px, 2.4vw, 44px); font-weight: 600; color: var(--brand-dark); }
    .status-bar { display: flex; justify-content: space-between; gap: 2vw; padding: 1.6vh 4vw; background: var(--surface); font-size: clamp(14px, 1.2vw, 22px); color: var(--muted); }
    .dot { display: inline-block; width: 0.8em; height: 0.8em; margin-right: 0.5em; border-radius: 50%; background: var(--muted); vertical-align: -0.05em; }
    .dot.ok { background: var(--entry); }
    .dot.bad { background: var(--brand); }
    /* Celebración: cumpleaños y aniversario laboral */
    .celebration { display: none; margin-top: 3vh; padding: 2vh 2vw; border-radius: 20px; background: linear-gradient(100deg, #fff7ed, #fdecee 60%, #fff1f2); border: 1px solid #f9d9b5; }
    .celebration.is-visible { display: block; animation: pop 0.5s cubic-bezier(.2, 1.4, .4, 1); }
    .celebration-title { font-size: clamp(30px, 3.6vw, 66px); font-weight: 800; letter-spacing: -0.02em; color: var(--brand); }
    .celebration-text { margin-top: 0.6vh; font-size: clamp(18px, 1.8vw, 32px); color: #9a3412; }
    @keyframes pop { from { opacity: 0; transform: scale(0.85) translateY(10px); } to { opacity: 1; transform: none; } }
    .card.is-celebrating .photo { box-shadow: 0 0 0 8px #fde68a, 0 0 0 16px #fdecee; }
    #confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5; }
  </style>
</head>
<body>
  <div class="kiosk">
    <header class="kiosk-header">
      <div class="brand"><span>TRIPOLIVEN</span> · Control de acceso</div>
      <div class="header-date" id="header-date"></div>
    </header>

    <main class="stage" aria-live="polite">
      <section class="idle" id="idle">
        <div class="idle-clock" id="clock"></div>
        <div class="idle-hint">Acerque su tarjeta al lector</div>
      </section>

      <section class="card" id="card">
        <div id="photo-slot"></div>
        <div>
          <span class="badge" id="badge"></span>
          <h1 class="name" id="name"></h1>
          <div class="meta" id="meta"></div>
          <div class="time" id="time"></div>
          <div class="message" id="message"></div>
          <div class="celebration" id="celebration" aria-live="polite">
            <div class="celebration-title" id="celebration-title"></div>
            <div class="celebration-text" id="celebration-text"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="status-bar">
      <span><i class="dot" id="reader-dot"></i><span id="reader-label">Comprobando lector…</span></span>
      <span><i class="dot" id="server-dot"></i><span id="server-label">Conectando con el servidor…</span></span>
    </footer>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script>
    const FEED_URL = '{{ feed_url }}';
    // Misma zona horaria que el servidor, para que el reloj coincida con la hora de los marcajes.
    const TIME_ZONE = (() => {
      try { new Intl.DateTimeFormat('es', { timeZone: '{{ time_zone }}' }); return '{{ time_zone }}'; } catch (error) { return undefined; }
    })();
    const POLL_MS = 1000;
    const SHOW_MS = 6000;
    const CELEBRATION_MS = 9000;
    const QUEUED_SHOW_MS = 3500;
    const LABELS = { entry: 'ENTRADA', exit: 'SALIDA', denied: 'ACCESO DENEGADO', unknown_card: 'TARJETA NO RECONOCIDA' };
    const $ = (id) => document.getElementById(id);
    let cursor = null;
    let queue = [];
    let showing = false;

    const tick = () => {
      const now = new Date();
      $('clock').textContent = now.toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23', timeZone: TIME_ZONE });
      const date = now.toLocaleDateString('es-VE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: TIME_ZONE });
      $('header-date').textContent = date.charAt(0).toUpperCase() + date.slice(1);
    };

    const renderPhoto = (event) => {
      const slot = $('photo-slot');
      slot.replaceChildren();
      if (event.photo) {
        const img = document.createElement('img');
        img.className = 'photo';
        img.alt = '';
        img.src = event.photo;
        slot.appendChild(img);
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'photo placeholder';
        placeholder.textContent = event.name ? event.name.charAt(0).toUpperCase() : '?';
        slot.appendChild(placeholder);
      }
    };

    // ---------- Celebraciones ----------
    const firstName = (name) => (name || '').split(' ')[0];
    const renderCelebration = (event) => {
      const box = $('celebration');
      const party = event.celebration;
      $('card').classList.toggle('is-celebrating', Boolean(party));
      if (!party) {
        box.classList.remove('is-visible');
        return false;
      }
      if (party.type === 'birthday') {
        $('celebration-title').textContent = `¡Feliz cumpleaños, ${firstName(event.name)}!`;
        $('celebration-text').textContent = 'Todo el equipo de Tripoliven te desea un gran día.';
      } else {
        $('celebration-title').textContent = `¡Feliz aniversario, ${firstName(event.name)}!`;
        $('celebration-text').textContent = `Hoy cumples ${party.years} año${party.years === 1 ? '' : 's'} con nosotros. ¡Gracias por tu esfuerzo!`;
      }
      box.classList.remove('is-visible');
      void box.offsetWidth;  // Reinicia la animación si hay dos celebraciones seguidas.
      box.classList.add('is-visible');
      launchConfetti(party.type === 'birthday' ? ['#c8102e', '#f59e0b', '#ec4899', '#3b82f6', '#10b981'] : ['#c8102e', '#b45309', '#f59e0b', '#fde68a', '#111827']);
      return true;
    };

    // Confeti ligero en un canvas (sin librerías externas).
    const canvas = $('confetti');
    const context = canvas.getContext('2d');
    let pieces = [];
    let animating = false;
    const launchConfetti = (colors) => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      for (let index = 0; index < 220; index += 1) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * canvas.height * 0.6,
          size: 6 + Math.random() * 8,
          color: colors[index % colors.length],
          speed: 2 + Math.random() * 3.5,
          drift: -1.2 + Math.random() * 2.4,
          angle: Math.random() * Math.PI,
          spin: -0.15 + Math.random() * 0.3,
        });
      }
      if (!animating) { animating = true; requestAnimationFrame(drawConfetti); }
    };
    const drawConfetti = () => {
      context.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach((piece) => {
        piece.y += piece.speed;
        piece.x += piece.drift + Math.sin(piece.y / 40);
        piece.angle += piece.spin;
        context.save();
        context.translate(piece.x, piece.y);
        context.rotate(piece.angle);
        context.fillStyle = piece.color;
        context.fillRect(-piece.size / 2, -piece.size / 4, piece.size, piece.size / 2);
        context.restore();
      });
      pieces = pieces.filter((piece) => piece.y < canvas.height + 30);
      if (pieces.length) {
        requestAnimationFrame(drawConfetti);
      } else {
        animating = false;
        context.clearRect(0, 0, canvas.width, canvas.height);
      }
    };

    const showNext = () => {
      const event = queue.shift();
      if (!event) {
        showing = false;
        $('card').classList.remove('is-visible');
        $('idle').style.display = '';
        return;
      }
      showing = true;
      renderPhoto(event);
      $('badge').className = `badge ${event.kind}`;
      $('badge').textContent = LABELS[event.kind] || '';
      $('name').textContent = event.name || (event.kind === 'unknown_card' ? 'Tarjeta sin registrar' : '');
      $('meta').textContent = [event.department, event.position].filter(Boolean).join(' · ') || (event.card_code ? `Código ${event.card_code}` : '');
      $('time').textContent = event.time;
      $('message').textContent = event.kind === 'denied' ? event.message : (event.kind === 'unknown_card' ? 'Diríjase al personal de seguridad.' : '');
      const party = renderCelebration(event);
      $('idle').style.display = 'none';
      $('card').classList.add('is-visible');
      setTimeout(showNext, party ? CELEBRATION_MS : (queue.length ? QUEUED_SHOW_MS : SHOW_MS));
    };

    const setStatus = (dotId, labelId, ok, label) => {
      $(dotId).className = `dot ${ok ? 'ok' : 'bad'}`;
      $(labelId).textContent = label;
    };

    const poll = async () => {
      try {
        const params = cursor ? `?log=${cursor.log}&event=${cursor.event}` : '';
        const response = await fetch(FEED_URL + params, { cache: 'no-store', credentials: 'same-origin' });
        if (!response.ok) throw new Error(response.status);
        const data = await response.json();
        cursor = data.cursor;
        setStatus('server-dot', 'server-label', true, 'Servidor en línea');
        setStatus('reader-dot', 'reader-label', data.reader.online, data.reader.label);
        if (data.events.length) {
          queue.push(...data.events);
          if (!showing) showNext();
        }
      } catch (error) {
        setStatus('server-dot', 'server-label', false, 'Sin conexión con el servidor');
      } finally {
        setTimeout(poll, POLL_MS);
      }
    };

    tick();
    setInterval(tick, 1000);
    poll();
  </script>
</body>
</html>
